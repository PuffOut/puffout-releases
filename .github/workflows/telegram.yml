name: Publish PuffOut to Telegram

on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:
    inputs:
      check_only:
        description: Check bot access without publishing
        type: boolean
        default: true
      existing_message_id:
        description: Existing Telegram post ID to update, or empty to publish a new post
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: puffout-telegram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get release files
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Verify bot access or publish release
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
          EXISTING_MESSAGE_ID: ${{ inputs.existing_message_id }}
        run: |
          args=(--html --yes)
          if [ "$CHECK_ONLY" = "true" ]; then
            args+=(--check)
          fi
          if [ -n "$EXISTING_MESSAGE_ID" ]; then
            args+=(--edit-message-id "$EXISTING_MESSAGE_ID")
          fi
          python3 publish.py "${args[@]}"
